<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f2f2f2;
    }

    .calculadora {
      width: 300px;
      padding: 20px;
      background: #222;
      border-radius: 15px;
    }

    #display {
      width: 100%;
      box-sizing: border-box;
      height: 60px;
      margin-bottom: 15px;
      font-size: 28px;
      text-align: right;
      padding: 10px;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 55px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #ccc;
    }

    .operador {
      background: #ff9500;
      color: white;
    }

    .igual {
      background: #28a745;
      color: white;
    }

    .limpar {
      background: #dc3545;
      color: white;
    }
  </style>
</head>

<body>

  <div class="calculadora">
    <input type="text" id="display" value="0" readonly>

    <div class="botoes">
      <button class="limpar" onclick="limpar()">C</button>
      <button onclick="adicionar('(')">(</button>
      <button onclick="adicionar(')')">)</button>
      <button class="operador" onclick="adicionar('/')">÷</button>

      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button class="operador" onclick="adicionar('*')">×</button>

      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button class="operador" onclick="adicionar('-')">−</button>

      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>
      <button class="operador" onclick="adicionar('+')">+</button>

      <button onclick="adicionar('0')">0</button>
      <button onclick="adicionar('.')">.</button>
      <button class="igual" onclick="calcular()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function adicionar(valor) {
      if (display.value === "0" && !isNaN(valor)) {
        display.value = valor;
      } else {
        display.value += valor;
      }
    }

    function limpar() {
      display.value = "0";
    }

    function calcular() {
      try {
        const resultado = Function(
          `"use strict"; return (${display.value})`
        )();

        if (!Number.isFinite(resultado)) {
          throw new Error();
        }

        display.value = resultado;
      } catch {
        display.value = "Erro";
      }
    }
  </script>

</body>
</html>
